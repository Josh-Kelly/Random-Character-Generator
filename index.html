<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Name Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Name Generator</h1>

      <label for="cultureSelect">Culture</label>
      <select id="cultureSelect"></select>

      <label for="genderSelect">Gender</label>
      <select id="genderSelect">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="random">Random</option>
      </select>

      <button type="button" onclick="generateName()">Generate Name</button>

      <label for="nameOutput">Name</label>
      <input id="nameOutput" readonly />
      <p id="nameNote" class="note"></p>
    </main>

    <script src="names.js"></script>
    <script src="generator.js"></script>
  </body>
</html>
